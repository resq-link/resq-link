name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - .yarn/versions/**

jobs:
  # Production web deploys through Vercel Git integration.
  # Root directory: apps/resq-link-web-app (unified command center + super admin).
  vercel-git:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Vercel Git deploy path
        run: |
          echo "Production web app deploys via Vercel Git integration."
          echo "  - spup/resq-link → apps/resq-link-web-app (/command-center/*, /admin/*)"
          echo "  - spup/resq-super-admin → apps/resq-link-web-app (legacy project alias)"
          echo "Build validation runs in the CI workflow (.github/workflows/ci.yml)."
