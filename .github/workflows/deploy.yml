name: Deploy

on:
  push:
    branches:
      - staging
      - main
    tags:
      - v*
    paths-ignore:
      - .yarn/versions/**

jobs:
  # Dispatcher + super-admin ship through Vercel Git integration on every push to main.
  # Keep this job green so production CI is not blocked by the legacy E2B flow.
  vercel-git:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Vercel Git deploy path
        run: |
          echo "Production web apps deploy via Vercel Git:"
          echo "  - spup/resq-link (apps/dispatcher-web-app)"
          echo "  - spup/resq-super-admin (apps/super-admin-web-app)"
          echo "GitHub Actions no longer runs the broken E2B template build on main."

  # Legacy E2B template deploy for staging / version tags only.
  deploy-e2b:
    if: github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: deploy-e2b-${{ github.ref }}
    uses: ./.github/workflows/deploy-e2b.yml
    secrets: inherit
    with:
      environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      channel: stable

  notify:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-latest
    needs: [deploy-e2b]
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "*Deploy* for `${{ github.repository }}` on `${{ github.ref }}`",
              "blocks": [
                { "type": "section",
                  "text": { "type": "mrkdwn",
                    "text": "*Deploy* for `${{ github.repository }}` on `${{ github.ref }}`"
                  }
                },
                { "type": "context",
                  "elements": [
                    { "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
